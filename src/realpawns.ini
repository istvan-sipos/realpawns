# realpawns.ini: configuration for the DDDA realpawns mod.
# Lives beside realpawns.dll.  Lines starting with ; or # are comments.
#
# realpawns.log handling.  One of:
#   disabled - no log file written
#   truncate - log file is reset at each game start (default)
#   append   - each game start appends to the existing log
[main]
logging = truncate

[features]
# Official rift pawns keep their progress.  Each save stores your hired
# pawns' gear, skills, vocation ranks, Discipline and bestiary knowledge in
# the realpawns\ folder, and the rift shows them that way from then on.
# 1 on, 0 off.
persist = 1
# Support pawns earn Discipline and vocation rank from kills.  They still
# gain no XP and never level up.  1 on, 0 off.
discipline = 1
# Inn skill screen: tabs for support pawns, so they can learn and set
# skills with the Discipline they earn.  1 on, 0 off.
skill_tabs = 1
# Rift pawns know every vocation's starting skills (e.g. Blink Strike),
# like a character who has tried every vocation, so the upgrades
# (e.g. Burst Strike) can be learned.  1 on, 0 off.
innate_skills = 1
# Support pawns can change vocation.  Give the marker item (below) to a
# support pawn, then open the vocation screen: that pawn takes the main
# pawn's row.  The first present support pawn carrying it is chosen.
# 1 on, 0 off.
vocation_change = 1

[vocation]
# Item that marks the pawn to change.  Default 1529 = Neutralizing Elixir.
marker_item = 1529
# 1 = one marker is used up for each vocation change, 0 = it is kept.
consume_marker = 0
