# realpawns.ini: configuration for the DDDA realpawns mod.
# Lives beside realpawns.dll.  Lines starting with ; or # are comments.
#
# realpawns.log handling.  One of:
#   disabled - no log file written
#   truncate - log file is reset at each game start (default)
#   append   - each game start appends to the existing log
[main]
logging = truncate

[features]
# Hiring an official rift pawn makes your own clone of it; the original
# stays in the rift unchanged.  Each save stores your hired clones' level,
# stats, gear, skills, vocation ranks, Discipline and bestiary knowledge
# in the realpawns\ folder, and the rift shows them that way from then
# on.  The level search lists your clones saved at that level first.
# 1 on, 0 off.
persist = 1
# Support pawns earn Discipline and vocation rank from kills.  1 on, 0 off.
discipline = 1
# Clones also gain XP like your main pawn and level up.  Needs persist and
# discipline.  1 on, 0 off.
leveling = 1
# Inn skill screen: tabs for support pawns, so they can learn and set
# skills with the Discipline they earn.  1 on, 0 off.
skill_tabs = 1
# Rift pawns know every vocation's starting skills (e.g. Blink Strike),
# like a character who has tried every vocation, so the upgrades
# (e.g. Burst Strike) can be learned.  1 on, 0 off.
innate_skills = 1
# Support pawns can change vocation.  Give the marker item (below) to a
# support pawn, then open the vocation screen: that pawn takes the main
# pawn's row.  The first present support pawn carrying it is chosen.
# 1 on, 0 off.
vocation_change = 1
# Inclination elixirs (Scather's ... Acquisitor's, and the Neutralizing
# Elixir) can be used from the main pawn's and support pawns' inventories
# and act on the pawn that carries them.  1 on, 0 off.
inclination_elixirs = 1

[vocation]
# Item that marks the pawn to change.  Default 1529 = Neutralizing Elixir.
marker_item = 1529
# 1 = one marker is used up for each vocation change, 0 = it is kept.
consume_marker = 0

[gear]
# Support pawns: keep items you unequip in the pawn's inventory instead of
# sending them away when the equipment menu closes.  1 on, 0 off.
keep_items = 1
# Support pawns: skip the "Removing this equipment will send it away"
# confirmation (no longer true once keep_items is on).  1 on, 0 off.
skip_prompt = 1
# Support pawns: enable [Equip] for gear they normally refuse (restricted
# item types, and upgraded items such as 3-star or dragonforged).  1 on, 0 off.
allow_equip = 1
# Allow giving restricted items to a support pawn, with [Give] or by
# withdrawing them from storage.  Needed to hand them the Neutralizing
# Elixir and the inclination elixirs.  1 on, 0 off.
allow_give = 1
# Barroch's upgrade screen gets pages for your support pawns, as the
# smiths' does (normally it shows only you, your main pawn and storage).
# 1 on, 0 off.
upgrade_pages = 1
