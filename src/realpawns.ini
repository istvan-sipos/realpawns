# realpawns.ini: configuration for the DDDA realpawns mod.
# Lives beside realpawns.dll.  Lines starting with ; or # are comments.
#
# realpawns.log handling.  One of:
#   disabled - no log file written
#   truncate - log file is reset at each game start (default)
#   append   - each game start appends to the existing log
[main]
logging = truncate

# Hiring an official rift pawn always makes your own clone of it; the
# original stays in the rift unchanged.  Rift pawns always know every
# vocation's starting skills (e.g. Blink Strike), so the upgrades can be
# learned.  The switches below are 1 on, 0 off.
[features]
# Each save stores your hired clones' level, stats, gear, skills, vocation
# ranks, Discipline, inclination and bestiary knowledge in the realpawns\
# folder, so you can hire them again that way later.  The level search
# lists your clones saved at that level first.  With persist off, a clone
# keeps its progress only while it is in your party; clones saved earlier
# still show up as they were saved, but nothing new is stored.
persist = 1
# Support pawns earn Discipline and vocation rank from kills, and clones
# gain XP like your main pawn and level up.  The inn's skill screen gets
# tabs for support pawns, and a support pawn carrying the marker item
# (see [vocation]) takes the main pawn's row on the vocation screen.
pawn_progression = 1
# Inclination elixirs (Scather's ... Acquisitor's, and the Neutralizing
# Elixir) can be used from the main pawn's and support pawns' inventories
# and act on the pawn that carries them.
inclination_elixirs = 1
# Gear for support pawns: unequipped gear stays in their inventory (no
# "send it away" prompt), they can equip gear they normally refuse
# (restricted types, upgraded items such as 3-star or dragonforged), and
# Barroch's upgrade screen gets their pages.  Giving them restricted items
# (with [Give] or from storage) stays on while any of pawn_progression,
# inclination_elixirs or pawn_gear is on, since the elixirs are
# restricted items.
pawn_gear = 1

# Vocation change (part of pawn_progression).
[vocation]
# Item that marks the pawn to change.  Default 1529 = Neutralizing Elixir.
marker_item = 1529
# 1 = one marker is used up for each vocation change, 0 = it is kept.
consume_marker = 0
